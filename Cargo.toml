[package]
name = "micropuffer"
version = "0.2.0"
edition = "2024"
description = "In-memory turbopuffer-compatible query engine for local tests and mocks."
license = "MIT"
repository = "https://github.com/JasonLovesDoggo/micropuffer"
readme = "README.md"
keywords = ["mock", "search", "turbopuffer", "vector", "wasm"]
categories = ["database-implementations", "development-tools::testing"]
include = ["Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "fixtures/**", "src/**", "tests/**"]

[lib]
name = "micropuffer"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "micropuffer"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["alloc", "clock", "std"] }
clap = { version = "4", features = ["derive"] }
deunicode = "1"
globset = "0.4"
regex = "1"
rust-stemmers = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stop-words = { version = "0.10", features = ["nltk"] }
strsim = "0.11"
unicode-segmentation = "1"
wasm-bindgen = "0.2.122"
